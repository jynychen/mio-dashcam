[package]
name = "mio-dashcam"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mio-dashcam"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
rayon = "1"
regex = "1"
serde_json = "1"
walkdir = "2"

[profile.release]
opt-level = 3
